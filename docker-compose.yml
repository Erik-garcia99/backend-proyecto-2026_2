services:
  db:
    image: postgres:16-alpine
    container_name: selfiq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-selfiq}
      POSTGRES_USER: ${POSTGRES_USER:-selfiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-selfiq_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./seliq-schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./scripts/seed_auth.sql:/docker-entrypoint-initdb.d/02_seed_auth.sql:ro
      - ./scripts/migrate_gateway_identity.sql:/docker-entrypoint-initdb.d/03_gateway_identity.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: selfiq-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-selfiq}:${POSTGRES_PASSWORD:-selfiq_dev_password}@db:5432/${POSTGRES_DB:-selfiq}
      JWT_SECRET: ${JWT_SECRET:-cambia-esta-clave-en-produccion}
      INFLUXDB_VERSION: ${INFLUXDB_VERSION:-}
      INFLUXDB_URL: ${INFLUXDB_URL:-}
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:-}
      INFLUXDB_ORG: ${INFLUXDB_ORG:-}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET:-}
      INFLUXDB_DATABASE: ${INFLUXDB_DATABASE:-}
      INFLUXDB_RETENTION_POLICY: ${INFLUXDB_RETENTION_POLICY:-}
      INFLUXDB_MEASUREMENT: ${INFLUXDB_MEASUREMENT:-}
      INFLUXDB_TEMPERATURE_FIELD: ${INFLUXDB_TEMPERATURE_FIELD:-}
      INFLUXDB_BRANCH_TAG: ${INFLUXDB_BRANCH_TAG:-}
      INFLUXDB_LOOKBACK_HOURS: ${INFLUXDB_LOOKBACK_HOURS:-24}
      INFLUXDB_STALE_SECONDS: ${INFLUXDB_STALE_SECONDS:-90}
      INFLUXDB_TIMEOUT_SECONDS: ${INFLUXDB_TIMEOUT_SECONDS:-10}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
